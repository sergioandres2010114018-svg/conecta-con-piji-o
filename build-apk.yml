name: Generar APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el APK en "Releases" al crear una etiqueta v*

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.6"   # versión probada; puedes cambiarla por otra estable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Generar la carpeta android/
        run: >
          flutter create --platforms=android
          --org co.edu.pijino
          --project-name conecta_pijino
          --description "APP-Conecta con Pijiño"
          .

      - name: Ajustar Android (permisos, nombre, minSdk)
        run: dart run tools/patch_android.dart

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar íconos con el logo
        run: dart run flutter_launcher_icons

      - name: Analizar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Pruebas
        run: flutter test

      - name: Compilar APK (release)
        run: flutter build apk --release

      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk conecta-con-pijino.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: conecta-con-pijino-apk
          path: conecta-con-pijino.apk
          retention-days: 30

      - name: Publicar en Releases (solo con etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: conecta-con-pijino.apk
